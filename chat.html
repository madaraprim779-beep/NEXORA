
<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#090a12">
  <title>NEXORA — Messages</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #090a12;
      --panel: #121522;
      --border: #2a3046;
      --text: #f7f7ff;
      --muted: #9ba3bb;
      --purple: #8b5cf6;
      --blue: #4361ee;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      background: var(--bg);
      color: var(--text);
      font-family: system-ui, sans-serif;
    }
    header {
      padding: 15px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid var(--border);
    }
    .brand { font-size: 23px; font-weight: 900; }
    .logo {
      display: inline-grid;
      place-items: center;
      width: 38px;
      height: 38px;
      margin-right: 7px;
      border-radius: 12px;
      background: linear-gradient(135deg, var(--purple), var(--blue));
    }
    button, input { font: inherit; }
    button {
      cursor: pointer;
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 10px 12px;
      color: white;
      background: #191d2d;
    }
    button:disabled { opacity: .5; }
    .layout {
      display: grid;
      grid-template-columns: 290px minmax(0, 1fr);
      min-height: calc(100vh - 69px);
    }
    aside {
      padding: 16px;
      border-right: 1px solid var(--border);
    }
    main {
      display: flex;
      flex-direction: column;
      min-width: 0;
      min-height: 75vh;
    }
    h2 { font-size: 18px; }
    .muted { color: var(--muted); font-size: 13px; }
    .field {
      display: flex;
      gap: 7px;
      margin-bottom: 12px;
    }
    input {
      min-width: 0;
      width: 100%;
      padding: 12px;
      border: 1px solid var(--border);
      border-radius: 10px;
      color: white;
      background: #090c15;
    }
    .primary {
      background: linear-gradient(110deg, var(--purple), var(--blue));
      border: 0;
      font-weight: 700;
    }
    #contacts { display: grid; gap: 8px; }
    .contact { width: 100%; text-align: left; }
    .contact.active { border-color: var(--purple); }
    .chat-head {
      padding: 16px;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }
    .actions { display: flex; flex-wrap: wrap; gap: 6px; }
    #messages {
      flex: 1;
      min-height: 300px;
      max-height: 65vh;
      overflow-y: auto;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .bubble {
      max-width: 82%;
      padding: 10px 13px;
      border-radius: 14px;
      background: #1b2032;
      overflow-wrap: anywhere;
      align-self: flex-start;
    }
    .bubble.mine {
      align-self: flex-end;
      background: linear-gradient(135deg, #6941c6, #344dc1);
    }
    .bubble small {
      display: block;
      margin-top: 5px;
      color: #d0d4e8;
      font-size: 10px;
    }
    #composer {
      padding: 12px;
      display: flex;
      gap: 8px;
      border-top: 1px solid var(--border);
    }
    #status {
      margin: 12px 16px;
      font-size: 13px;
      color: var(--muted);
    }
    #incoming {
      margin: 12px;
      padding: 12px;
      border: 1px solid var(--purple);
      border-radius: 12px;
    }
    @media (max-width: 650px) {
      .layout { grid-template-columns: 1fr; }
      aside { border-right: 0; border-bottom: 1px solid var(--border); }
      main { min-height: 65vh; }
      #messages { max-height: 50vh; }
    }
  </style>
</head>
<body>
<header>
  <div class="brand"><span class="logo">N</span>NEXORA</div>
  <button id="logout">Déconnexion</button>
</header>

<div class="layout">
  <aside>
    <h2>Contacts</h2>
    <p class="muted">Entre le pseudo exact de ton contact.</p>
    <form id="contactForm">
      <div class="field">
        <input id="contactUsername" placeholder="Pseudo du contact"
          minlength="3" maxlength="24" required>
      </div>
      <button class="primary" type="submit">Ouvrir une discussion</button>
    </form>
    <div id="contacts"></div>
    <p class="muted">Connecté : <strong id="myUsername">…</strong></p>
  </aside>

  <main>
    <div class="chat-head">
      <div>
        <strong id="chatTitle">Choisis un contact</strong>
        <div class="muted" id="chatSubtitle">Tes messages apparaîtront ici.</div>
      </div>
      <div class="actions">
        <button id="audioCall">☎ Audio</button>
        <button id="videoCall">▣ Vidéo</button>
      </div>
    </div>

    <div id="incoming" hidden>
      <p id="incomingText">Appel entrant</p>
      <div class="actions">
        <button class="primary" id="acceptCall">Accepter</button>
        <button id="rejectCall">Refuser</button>
      </div>
    </div>

    <div id="status" role="status">Vérification de la session…</div>
    <section id="messages" aria-live="polite"></section>

    <form id="composer">
      <input id="messageInput" placeholder="Écris un message…"
        maxlength="5000" autocomplete="off" required>
      <button class="primary" id="sendButton" type="submit">Envoyer</button>
    </form>

    <video id="remoteVideo" autoplay playsinline
      style="width:100%;max-height:260px;object-fit:contain" hidden></video>
    <video id="localVideo" autoplay playsinline muted
      style="width:120px;max-height:180px;object-fit:contain" hidden></video>
  </main>
</div>

<script type="module" src="/chat.js"></script>
</body>
</html>
