<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#080b16">
  <meta name="description" content="NEXORA — Tes conversations, réunies dans un seul espace.">
  <title>NEXORA — Messages</title>

  <style>
    :root {
      --bg: #080b16;
      --panel: #101629;
      --panel2: #151d33;
      --border: rgba(157, 174, 255, .14);
      --blue: #6977ff;
      --cyan: #37d7f8;
      --text: #f4f6ff;
      --muted: #96a3c3;
      --green: #54e6ac;
      --red: #ff667d;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      min-height: 100dvh;
      color: var(--text);
      background:
        radial-gradient(ellipse at top left, #202958 0, transparent 40%),
        var(--bg);
      font-family: system-ui, -apple-system, sans-serif;
    }

    button, input, textarea {
      font: inherit;
    }

    button {
      cursor: pointer;
    }

    button:disabled {
      opacity: .5;
      cursor: not-allowed;
    }

    .app {
      display: grid;
      grid-template-columns: 340px minmax(0, 1fr);
      height: 100vh;
      height: 100dvh;
      max-width: 1600px;
      margin: auto;
      overflow: hidden;
      background: rgba(8, 11, 22, .88);
    }

    .sidebar {
      display: flex;
      flex-direction: column;
      min-width: 0;
      border-right: 1px solid var(--border);
      background: rgba(16, 22, 41, .96);
    }

    .brandbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 20px 17px;
      border-bottom: 1px solid var(--border);
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 23px;
      font-weight: 900;
      letter-spacing: 1.5px;
    }

    .brand span {
      color: var(--cyan);
    }

    .logo {
      display: grid;
      place-items: center;
      width: 40px;
      height: 40px;
      border-radius: 13px;
      background: linear-gradient(135deg, var(--blue), var(--cyan));
      font-size: 21px;
      color: white;
    }

    .iconbtn {
      display: grid;
      place-items: center;
      width: 42px;
      height: 42px;
      flex-shrink: 0;
      border: 1px solid var(--border);
      border-radius: 13px;
      color: var(--text);
      background: var(--panel2);
      font-size: 18px;
    }

    .profile {
      display: flex;
      align-items: center;
      gap: 11px;
      padding: 17px;
      border-bottom: 1px solid var(--border);
    }

    .avatar {
      display: grid;
      place-items: center;
      width: 45px;
      height: 45px;
      flex-shrink: 0;
      border-radius: 50%;
      background: linear-gradient(135deg, #596aff, #26bde7);
      color: white;
      font-size: 17px;
      font-weight: 800;
    }

    .profileinfo {
      min-width: 0;
      flex: 1;
    }

    .profileinfo strong,
    .profileinfo small {
      display: block;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .profileinfo small {
      margin-top: 4px;
      color: var(--green);
      font-size: 12px;
    }

    .sectionhead {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      padding: 20px 17px 12px;
    }

    .sectionhead h2 {
      font-size: 17px;
    }

    .sectionhead span {
      color: var(--muted);
      font-size: 12px;
    }

    .searchbox {
      padding: 0 15px 12px;
    }

    .searchbox input,
    .contactsearch input {
      width: 100%;
      min-width: 0;
      padding: 13px 14px;
      border: 1px solid var(--border);
      border-radius: 12px;
      outline: none;
      color: white;
      background: #0a1020;
      font-size: 14px;
    }

    input:focus,
    textarea:focus {
      border-color: var(--blue);
    }

    .contactsearch {
      display: flex;
      gap: 8px;
      padding: 0 15px 14px;
    }

    .contactsearch input {
      flex: 1;
    }

    .primary {
      padding: 12px 14px;
      border: 0;
      border-radius: 12px;
      color: white;
      background: linear-gradient(110deg, #6573ff, #387ce9);
      font-size: 13px;
      font-weight: 800;
    }

    .conversationlist {
      flex: 1;
      overflow-y: auto;
      padding: 0 9px 15px;
    }

    .conversationitem {
      display: flex;
      align-items: center;
      width: 100%;
      gap: 11px;
      padding: 12px 10px;
      border: 1px solid transparent;
      border-radius: 14px;
      color: var(--text);
      text-align: left;
      background: transparent;
    }

    .conversationitem.active,
    .conversationitem:hover {
      border-color: var(--border);
      background: #202947;
    }

    .conversationtext {
      min-width: 0;
      flex: 1;
    }

    .conversationtext strong,
    .conversationtext small {
      display: block;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .conversationtext small {
      margin-top: 5px;
      color: var(--muted);
      font-size: 12px;
    }

    .empty {
      padding: 18px 12px;
      color: var(--muted);
      font-size: 13px;
      line-height: 1.7;
      text-align: center;
    }

    .sidebarfooter {
      display: flex;
      gap: 8px;
      padding: 12px;
      border-top: 1px solid var(--border);
    }

    .sidebarfooter button {
      flex: 1;
    }

    .main {
      display: flex;
      flex-direction: column;
      min-width: 0;
      min-height: 0;
    }

    .chatheader {
      display: flex;
      align-items: center;
      gap: 12px;
      min-height: 79px;
      padding: 14px 20px;
      border-bottom: 1px solid var(--border);
      background: rgba(16, 22, 41, .8);
    }

    .chatidentity {
      min-width: 0;
      flex: 1;
    }

    .chatidentity strong,
    .chatidentity small {
      display: block;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .chatidentity small {
      margin-top: 5px;
      color: var(--muted);
      font-size: 12px;
    }

    .headeractions {
      display: flex;
      gap: 8px;
    }

    .welcome {
      display: flex;
      flex: 1;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 25px;
      text-align: center;
    }

    .welcomeicon {
      display: grid;
      place-items: center;
      width: 90px;
      height: 90px;
      margin-bottom: 22px;
      border: 1px solid var(--border);
      border-radius: 29px;
      background: linear-gradient(135deg, #252e5a, #101b35);
      font-size: 40px;
    }

    .welcome h2 {
      margin-bottom: 10px;
      font-size: 26px;
    }

    .welcome p {
      max-width: 340px;
      color: var(--muted);
      font-size: 14px;
      line-height: 1.8;
    }

    .welcome .primary {
      margin-top: 20px;
    }

    .messages {
      display: none;
      flex: 1;
      flex-direction: column;
      gap: 12px;
      overflow-y: auto;
      padding: 22px;
      scroll-behavior: smooth;
    }

    .message {
      max-width: min(78%, 520px);
      padding: 12px 15px;
      border: 1px solid var(--border);
      border-radius: 17px 17px 17px 5px;
      background: #151e34;
      overflow-wrap: anywhere;
      white-space: pre-wrap;
      line-height: 1.55;
    }

    .message.mine {
      align-self: flex-end;
      border-color: #7782ff55;
      border-radius: 17px 17px 5px 17px;
      background: linear-gradient(135deg, #343e87, #29365f);
    }

    .message .meta {
      display: block;
      margin-top: 7px;
      color: #b5c0de;
      font-size: 10px;
      text-align: right;
    }

    .composer {
      display: none;
      align-items: flex-end;
      gap: 10px;
      padding: 14px 17px;
      border-top: 1px solid var(--border);
      background: #101629;
    }

    .composer textarea {
      flex: 1;
      min-width: 0;
      max-height: 130px;
      min-height: 47px;
      padding: 13px 14px;
      resize: vertical;
      border: 1px solid var(--border);
      border-radius: 14px;
      outline: none;
      color: white;
      background: #080e1d;
      font-size: 14px;
    }

    .sendbtn {
      width: 49px;
      height: 47px;
      border: 0;
      border-radius: 14px;
      color: white;
      background: linear-gradient(135deg, var(--blue), #278bd9);
      font-size: 21px;
    }

    .statusline {
      padding: 7px 15px;
      color: var(--muted);
      font-size: 11px;
      text-align: center;
    }

    .hidden {
      display: none !important;
    }

    .mobileback {
      display: none;
    }

    .overlay {
      position: fixed;
      inset: 0;
      z-index: 10;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 20px;
      background: #000a;
    }

    .overlay.show {
      display: flex;
    }

    .modal {
      width: 100%;
      max-width: 420px;
      padding: 22px;
      border: 1px solid var(--border);
      border-radius: 20px;
      background: #121a30;
    }

    .modal h3 {
      margin-bottom: 12px;
    }

    .modal p {
      margin-bottom: 15px;
      color: var(--muted);
      font-size: 13px;
      line-height: 1.6;
    }

    .modalactions {
      display: flex;
      justify-content: flex-end;
      gap: 8px;
      margin-top: 16px;
    }

    @media (max-width: 760px) {
      .app {
        display: block;
      }

      .sidebar {
        width: 100%;
        height: 100%;
        border-right: 0;
      }

      .main {
        display: none;
        width: 100%;
        height: 100%;
      }

      .app.chat-open .sidebar {
        display: none;
      }

      .app.chat-open .main {
        display: flex;
      }

      .mobileback {
        display: grid;
      }

      .brandbar {
        padding: 15px;
      }

      .chatheader {
        min-height: 70px;
        padding: 10px 12px;
      }

      .headeractions {
        gap: 5px;
      }

      .iconbtn {
        width: 38px;
        height: 38px;
      }

      .messages {
        padding: 15px 12px;
      }

      .composer {
        padding: 10px;
      }

      .message {
        max-width: 88%;
      }
    }
  </style>
</head>

<body>
  <div class="app" id="app">
    <aside class="sidebar">
      <div class="brandbar">
        <div class="brand">
          <div class="logo">N</div>
          NEX<span>ORA</span>
        </div>
        <button class="iconbtn" id="refreshBtn" title="Actualiser les conversations" aria-label="Actualiser">↻</button>
      </div>

      <div class="profile">
        <div class="avatar" id="myAvatar">N</div>
        <div class="profileinfo">
          <strong id="myName">Chargement...</strong>
          <small>● En ligne</small>
        </div>
        <button class="iconbtn" id="profileBtn" title="Mon profil" aria-label="Mon profil">👤</button>
      </div>

      <div class="sectionhead">
        <h2>Messages</h2>
        <span id="conversationCount">0 discussion</span>
      </div>

      <div class="searchbox">
        <input id="filterInput" type="search" placeholder="Filtrer les discussions..." aria-label="Filtrer les discussions">
      </div>

      <div class="contactsearch">
        <input id="contactInput" type="text" placeholder="Pseudo ou ID NEXORA" aria-label="Rechercher un contact">
        <button class="primary" id="searchBtn">Chercher</button>
      </div>

      <div class="conversationlist" id="conversationList">
        <div class="empty">Tes conversations apparaîtront ici.</div>
      </div>

      <div class="sidebarfooter">
        <button class="iconbtn" id="statusBtn" title="Statuts" aria-label="Statuts">◉ Statuts</button>
        <button class="iconbtn" id="logoutBtn" title="Déconnexion" aria-label="Déconnexion">↪ Sortir</button>
      </div>
    </aside>

    <main class="main">
      <header class="chatheader">
        <button class="iconbtn mobileback" id="backBtn" aria-label="Retour aux discussions">‹</button>
        <div class="avatar" id="chatAvatar">N</div>
        <div class="chatidentity">
          <strong id="chatName">NEXORA</strong>
          <small id="chatSubtitle">Choisis une conversation</small>
        </div>
        <div class="headeractions">
          <button class="iconbtn" id="audioBtn" title="Appel audio" aria-label="Appel audio">☎</button>
          <button class="iconbtn" id="videoBtn" title="Appel vidéo" aria-label="Appel vidéo">▣</button>
          <button class="iconbtn" id="moreBtn" title="Options" aria-label="Options">⋯</button>
        </div>
      </header>

      <section class="welcome" id="welcome">
        <div class="welcomeicon">✦</div>
        <h2>Bienvenue sur NEXORA</h2>
        <p>
          Ton espace de discussion est prêt à s'ouvrir.
          Recherche un utilisateur pour démarrer une conversation.
        </p>
        <button class="primary" id="findContactBtn">Trouver un contact</button>
      </section>

      <section class="messages" id="messages" aria-live="polite"></section>

      <div class="statusline" id="statusLine">Connecté à NEXORA</div>

      <form class="composer" id="composer">
        <textarea id="messageInput" rows="1" maxlength="5000"
          placeholder="Écris un message..." aria-label="Écrire un message"></textarea>
        <button class="sendbtn" id="sendBtn" type="submit" aria-label="Envoyer le message">➤</button>
      </form>
    </main>
  </div>

  <div class="overlay" id="modalOverlay">
    <div class="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
      <h3 id="modalTitle">NEXORA</h3>
      <p id="modalText"></p>
      <div class="modalactions">
        <button class="iconbtn" id="modalCancel">Fermer</button>
        <button class="primary" id="modalConfirm">OK</button>
      </div>
    </div>
  </div>

  <script>
    // Sécurité de navigation : la session doit exister avant d'afficher les discussions.
    let session = null;
    let currentUser = null;

    try {
      session = JSON.parse(sessionStorage.getItem("nexora_session") || "null");
      currentUser = JSON.parse(sessionStorage.getItem("nexora_user") || "null");
    } catch (_) {
      session = null;
      currentUser = null;
    }

    if (!session?.access_token || !currentUser) {
      window.location.replace("/");
    }

    const app = document.getElementById("app");

    function showModal(title, message, confirmText = "OK", onConfirm = null) {
      document.getElementById("modalTitle").textContent = title;
      document.getElementById("modalText").textContent = message;
      document.getElementById("modalConfirm").textContent = confirmText;
      document.getElementById("modalOverlay").classList.add("show");

      const confirm = document.getElementById("modalConfirm");
      confirm.onclick = () => {
        document.getElementById("modalOverlay").classList.remove("show");
        if (onConfirm) onConfirm();
      };
    }

    document.getElementById("modalCancel").onclick = () => {
      document.getElementById("modalOverlay").classList.remove("show");
    };

    function requireChatJS() {
      // Le module gère l'API, les contacts et les messages.
      document.getElementById("statusLine").textContent = "Chargement de tes conversations...";
    }

    document.getElementById("backBtn").onclick = () => {
      app.classList.remove("chat-open");
    };

    document.getElementById("findContactBtn").onclick = () => {
      document.getElementById("contactInput").focus();
      app.classList.remove("chat-open");
    };

    document.getElementById("searchBtn").onclick = () => {
      document.getElementById("contactInput").dispatchEvent(
        new KeyboardEvent("keydown", { key: "Enter", bubbles: true })
      );
    };

    document.getElementById("profileBtn").onclick = () => {
      showModal(
        "Mon profil NEXORA",
        "Utilisateur : " + (currentUser?.username || "Utilisateur") +
        "\n\nL'édition du profil dépend de l'API de ton projet."
      );
    };

    document.getElementById("statusBtn").onclick = () => {
      showModal(
        "Statuts NEXORA",
        "L'interface est prête pour cette fonctionnalité. La publication et l'affichage des statuts doivent être reliés à l'API."
      );
    };

    document.getElementById("audioBtn").onclick = () => {
      showModal(
        "Appel audio",
        "Les appels audio nécessitent une connexion WebRTC et un système de signalisation. Ce bouton ne démarre pas encore un véritable appel."
      );
    };

    document.getElementById("videoBtn").onclick = () => {
      showModal(
        "Appel vidéo",
        "Les appels vidéo nécessitent une connexion WebRTC et un système de signalisation. Ce bouton ne démarre pas encore un véritable appel."
      );
    };

    document.getElementById("moreBtn").onclick = () => {
      showModal(
        "Options de conversation",
        "Les options avancées seront disponibles lorsqu'une conversation sera ouverte."
      );
    };

    document.getElementById("refreshBtn").onclick = () => {
      window.dispatchEvent(new CustomEvent("nexora:refresh"));
    };

    document.getElementById("logoutBtn").onclick = () => {
      showModal(
        "Déconnexion",
        "Veux-tu fermer ta session NEXORA sur cet appareil ?",
        "Déconnexion",
        async () => {
          try {
            await fetch("/api/logout", {
              method: "POST",
              headers: {
                "Content-Type": "application/json",
                "Authorization": "Bearer " + session.access_token
              }
            });
          } catch (_) {
            // La session locale sera fermée même si l'API répond mal.
          }

          sessionStorage.removeItem("nexora_session");
          sessionStorage.removeItem("nexora_user");
          window.location.replace("/");
        }
      );
    };

    requireChatJS();
  </script>

  <script type="module" src="/chat.js"></script>
</body>
</html>
