<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#07111f">
<title>NEXORA — Messages</title>
<style>
:root {
  color-scheme: dark;
  --bg:#07111f; --panel:#0c1a2a; --panel2:#102338;
  --line:#20384f; --text:#f2f7ff; --muted:#8ca3ba;
  --cyan:#56e0e9; --blue:#6094ff; --red:#ff7d91;
}
*{box-sizing:border-box}
body{margin:0;height:100dvh;overflow:hidden;background:var(--bg);
color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",sans-serif}
button,input,textarea{font:inherit}
button{cursor:pointer}
.app{height:100dvh;display:grid;grid-template-columns:320px minmax(0,1fr);max-width:1600px;margin:auto;background:#091522}
.sidebar{min-width:0;display:flex;flex-direction:column;background:var(--panel);border-right:1px solid var(--line)}
.side-top{padding:20px 16px 15px;border-bottom:1px solid var(--line)}
.brand-row{display:flex;align-items:center;justify-content:space-between;gap:10px}
.brand{display:flex;align-items:center;gap:11px}
.logo{width:43px;height:43px;display:grid;place-items:center;border-radius:14px;color:#06131d;font-weight:950;font-size:23px;background:linear-gradient(135deg,var(--cyan),var(--blue))}
.brand-name{font-size:20px;font-weight:900;letter-spacing:1.5px}
.brand-tag{color:var(--muted);font-size:10px;letter-spacing:1.5px;margin-top:3px}
.icon-btn{width:39px;height:39px;display:grid;place-items:center;color:var(--text);background:var(--panel2);border:1px solid var(--line);border-radius:12px}
.search-wrap{position:relative;margin-top:19px}
.search-wrap span{position:absolute;left:12px;top:10px;color:var(--muted);font-size:20px}
.search{width:100%;padding:12px 12px 12px 37px;background:#071421;border:1px solid var(--line);border-radius:12px;color:var(--text);outline:none}
.search:focus,textarea:focus{border-color:var(--cyan)}
.section-head{padding:16px 17px 8px;display:flex;justify-content:space-between;color:var(--muted);font-size:11px;font-weight:850;letter-spacing:1.3px;text-transform:uppercase}
.list{overflow:auto;min-height:0;flex:1;padding:0 8px 10px}
.contact{width:100%;display:flex;gap:11px;align-items:center;text-align:left;padding:11px 9px;margin:2px 0;border:1px solid transparent;border-radius:14px;color:var(--text);background:transparent}
.contact:hover{background:#12263a}
.contact.active{background:#153047;border-color:#28536b}
.avatar{width:43px;height:43px;flex:0 0 43px;display:grid;place-items:center;border-radius:15px;color:#e1fbff;font-weight:850;background:linear-gradient(140deg,#1b637a,#344c8e);border:1px solid #39718a}
.contact-text{flex:1;min-width:0}
.contact-name{font-size:14px;font-weight:750;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.contact-preview{font-size:12px;color:var(--muted);margin-top:5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.empty-list{color:var(--muted);font-size:13px;line-height:1.7;padding:15px 10px}
.profile-bar{padding:12px;display:flex;align-items:center;gap:10px;border-top:1px solid var(--line)}
.profile-info{flex:1;min-width:0}
.profile-name{font-size:13px;font-weight:800;overflow-wrap:anywhere}
.profile-id{font-size:11px;color:var(--muted);margin-top:4px}
.main{min-width:0;display:flex;flex-direction:column;position:relative}
.chat-header{min-height:75px;padding:13px 20px;display:flex;align-items:center;gap:12px;border-bottom:1px solid var(--line);background:#0a1827}
.chat-person{flex:1;min-width:0}
.chat-title{font-size:15px;font-weight:850;overflow-wrap:anywhere}
.chat-subtitle{font-size:12px;color:var(--muted);margin-top:5px}
.online{color:#69e5b1;font-size:11px;white-space:nowrap}
.back-btn{display:none}
.welcome{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:25px;background:radial-gradient(ellipse at center,#12304445,transparent 60%)}
.welcome-logo{width:86px;height:86px;display:grid;place-items:center;border-radius:28px;background:linear-gradient(140deg,var(--cyan),var(--blue));color:#06131d;font-size:42px;font-weight:950;margin-bottom:24px}
.welcome h1{font-size:clamp(24px,3vw,36px);letter-spacing:-1px;margin:0}
.welcome p{max-width:390px;color:var(--muted);font-size:14px;line-height:1.8}
.messages{display:none;flex:1;min-height:0;overflow-y:auto;padding:22px clamp(13px,4vw,45px);gap:12px;background:#091522;flex-direction:column}
.day-label{align-self:center;padding:7px 12px;border:1px solid var(--line);border-radius:30px;background:var(--panel2);color:var(--muted);font-size:11px}
.bubble-row{display:flex;flex-direction:column;gap:5px;max-width:min(78%,570px)}
.bubble-row.mine{align-self:flex-end;align-items:flex-end}
.bubble-row.theirs{align-self:flex-start;align-items:flex-start}
.bubble{padding:11px 14px;border:1px solid #263f56;border-radius:16px 16px 16px 5px;background:#12263a;font-size:14px;line-height:1.55;white-space:pre-wrap;overflow-wrap:anywhere}
.mine .bubble{border-color:#24717b;border-radius:16px 16px 5px 16px;background:linear-gradient(135deg,#145568,#244e7a)}
.time{font-size:10px;color:#8299ad;padding:0 4px}
.composer{display:none;align-items:flex-end;gap:10px;padding:13px 17px;border-top:1px solid var(--line);background:#0b1a2a}
.composer textarea{flex:1;min-width:0;min-height:46px;max-height:140px;resize:none;padding:13px 14px;border:1px solid var(--line);border-radius:14px;background:#071421;color:var(--text);outline:none}
.send-btn{width:47px;height:47px;flex:0 0 47px;border:0;border-radius:14px;background:linear-gradient(135deg,var(--cyan),var(--blue));color:#06131d;font-size:20px;font-weight:900}
.status{min-height:20px;padding:3px 18px;color:var(--muted);font-size:11px}
.status.error{color:var(--red)}
.hidden{display:none!important}
@media(max-width:720px){
 .app{grid-template-columns:1fr}
 .sidebar{display:flex}
 .main{display:none}
 body.mobile-chat .sidebar{display:none}
 body.mobile-chat .main{display:flex}
 .side-top{padding:16px 13px 12px}
 .back-btn{display:grid}
 .chat-header{padding:12px}
 .online{display:none}
 .messages{padding:16px 12px}
 .bubble-row{max-width:88%}
 .composer{padding:10px 10px max(10px,env(safe-area-inset-bottom))}
}
</style>
</head>
<body>
<div class="app">
  <aside class="sidebar">
    <div class="side-top">
      <div class="brand-row">
        <div class="brand">
          <div class="logo">N</div>
          <div><div class="brand-name">NEXORA</div><div class="brand-tag">MESSAGERIE PRIVÉE</div></div>
        </div>
        <button class="icon-btn" id="refreshBtn" title="Actualiser">↻</button>
      </div>
      <div class="search-wrap"><span>⌕</span><input id="searchInput" class="search" placeholder="Rechercher un contact…" autocomplete="off"></div>
    </div>
    <div class="section-head"><span>Conversations</span><span id="conversationCount">0</span></div>
    <div class="list" id="conversationList"><div class="empty-list">Chargement…</div></div>
    <div class="section-head"><span>Contacts</span><span id="contactCount">0</span></div>
    <div class="list" id="contactList"><div class="empty-list">Chargement…</div></div>
    <div class="profile-bar">
      <div class="avatar" id="myAvatar">N</div>
      <div class="profile-info"><div class="profile-name" id="myName">Mon compte</div><div class="profile-id" id="myId">NEXORA</div></div>
      <button class="icon-btn" id="logoutBtn" title="Déconnexion">⇥</button>
    </div>
  </aside>

  <main class="main">
    <header class="chat-header">
      <button class="icon-btn back-btn" id="backBtn" aria-label="Retour">‹</button>
      <div class="avatar" id="chatAvatar">N</div>
      <div class="chat-person"><div class="chat-title" id="chatTitle">Bienvenue sur NEXORA</div><div class="chat-subtitle" id="chatSubtitle">Choisis un contact pour discuter</div></div>
      <div class="online">● Connecté</div>
    </header>
    <section class="welcome" id="welcome">
      <div class="welcome-logo">N</div>
      <h1>Chaque échange compte.</h1>
      <p>Choisis un contact pour commencer une conversation. Tes messages apparaîtront ici.</p>
    </section>
    <section class="messages" id="messages" aria-live="polite"></section>
    <form class="composer" id="composer">
      <textarea id="messageInput" rows="1" maxlength="5000" placeholder="Écris ton message…" aria-label="Message"></textarea>
      <button class="send-btn" id="sendBtn" type="submit" aria-label="Envoyer">➤</button>
    </form>
    <div class="status" id="status" role="status" aria-live="polite"></div>
  </main>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const SUPABASE_URL = "https://tmjqzeycxgfwowodaxxo.supabase.co";
const SUPABASE_PUBLISHABLE_KEY = "sb_publishable_CJp2PmoUKPPx989lsipQiQ_6nWSp-xl";

const $ = id => document.getElementById(id);
let db, session, me, myProfile, profiles = [], conversations = [];
let activeConversation = null, activeContact = null, messageChannel = null;
let realtimeChannel = null, sending = false;

function status(message, type = "") {
  $("status").textContent = message || "";
  $("status").className = "status" + (type ? " " + type : "");
}
function initials(name) {
  return String(name || "?").trim().slice(0,1).toUpperCase() || "?";
}
function nameOf(profile) {
  return profile?.display_name || profile?.username || "Utilisateur";
}
function timeOf(value) {
  const date = new Date(value);
  return Number.isNaN(date.getTime()) ? "" :
    date.toLocaleTimeString("fr-FR",{hour:"2-digit",minute:"2-digit"});
}
function otherId(c) {
  return c.user_one === me.id ? c.user_two : c.user_one;
}

async function init() {
  let saved;
  try { saved = JSON.parse(sessionStorage.getItem("nexora_session") || "null"); } catch {}
  if (!saved?.access_token || !saved?.refresh_token) {
    location.replace("/");
    return;
  }
  if (!window.supabase?.createClient) {
    status("Service de messagerie indisponible. Vérifie ta connexion Internet.", "error");
    return;
  }

  db = window.supabase.createClient(SUPABASE_URL, SUPABASE_PUBLISHABLE_KEY, {
    auth: { persistSession: false, autoRefreshToken: false, detectSessionInUrl: false }
  });

  const {data, error} = await db.auth.setSession({
    access_token: saved.access_token,
    refresh_token: saved.refresh_token
  });
  if (error || !data.session?.user) {
    sessionStorage.removeItem("nexora_session");
    sessionStorage.removeItem("nexora_user");
    location.replace("/");
    return;
  }

  session = data.session;
  me = session.user;

  const result = await db.from("profiles")
    .select("id,username,nexora_id,display_name,created_at")
    .eq("id",me.id).maybeSingle();

  if (result.error) {
    status("Lecture du profil impossible : " + result.error.message,"error");
    return;
  }

  myProfile = result.data || {
    id: me.id,
    username: me.user_metadata?.username || "Utilisateur"
  };
  $("myName").textContent = nameOf(myProfile);
  $("myId").textContent = myProfile.nexora_id ? "ID : " + myProfile.nexora_id : "Compte NEXORA";
  $("myAvatar").textContent = initials(nameOf(myProfile));

  await loadData();
  subscribeRealtime();
}

async function loadData() {
  const [pResult, cResult] = await Promise.all([
    db.from("profiles").select("id,username,nexora_id,display_name,created_at")
      .neq("id",me.id).order("username").limit(500),
    db.from("conversations").select("id,user_one,user_two,created_at")
      .or("user_one.eq."+me.id+",user_two.eq."+me.id)
      .order("created_at",{ascending:false}).limit(200)
  ]);

  if (pResult.error) {
    status("Erreur contacts : " + pResult.error.message,"error");
    $("contactList").innerHTML = '<div class="empty-list">Vérifie les règles RLS de profiles.</div>';
    return;
  }
  if (cResult.error) {
    status("Erreur conversations : " + cResult.error.message,"error");
    $("conversationList").innerHTML = '<div class="empty-list">Vérifie les règles RLS de conversations.</div>';
    return;
  }
  profiles = pResult.data || [];
  conversations = cResult.data || [];
  renderContacts();
  await renderConversations();
  status("");
}

function renderContacts() {
  const query = $("searchInput").value.trim().toLowerCase();
  const list = $("contactList");
  list.replaceChildren();
  const filtered = profiles.filter(p =>
    !query || [nameOf(p),p.username,p.nexora_id].some(v => String(v||"").toLowerCase().includes(query))
  );
  $("contactCount").textContent = filtered.length;

  if (!filtered.length) {
    const empty = document.createElement("div");
    empty.className = "empty-list";
    empty.textContent = query ? "Aucun contact trouvé." : "Les nouveaux utilisateurs apparaîtront ici.";
    list.append(empty);
    return;
  }
  filtered.forEach(p => {
    const button = document.createElement("button");
    button.className = "contact" + (activeContact?.id === p.id ? " active" : "");
    button.type = "button";
    const avatar = document.createElement("div");
    avatar.className = "avatar";
    avatar.textContent = initials(nameOf(p));
    const info = document.createElement("div");
    info.className = "contact-text";
    const name = document.createElement("div");
    name.className = "contact-name";
    name.textContent = nameOf(p);
    const preview = document.createElement("div");
    preview.className = "contact-preview";
    preview.textContent = p.nexora_id ? "ID : " + p.nexora_id : "@" + (p.username||"utilisateur");
    info.append(name,preview);
    button.append(avatar,info);
    button.addEventListener("click",()=>startConversation(p));
    list.append(button);
  });
}

async function renderConversations() {
  const list = $("conversationList");
  list.replaceChildren();
  const query = $("searchInput").value.trim().toLowerCase();
  const rows = conversations.map(c => ({
    conversation:c,
    profile:profiles.find(p=>p.id===otherId(c))
  })).filter(r => r.profile &&
    (!query || [nameOf(r.profile),r.profile.username].some(v=>String(v||"").toLowerCase().includes(query)))
  );
  $("conversationCount").textContent = rows.length;

  if (!rows.length) {
    const empty = document.createElement("div");
    empty.className = "empty-list";
    empty.textContent = query ? "Aucune conversation trouvée." : "Tes conversations apparaîtront ici.";
    list.append(empty);
    return;
  }

  for (const row of rows) {
    const button = document.createElement("button");
    button.type = "button";
    button.className = "contact" + (activeConversation?.id===row.conversation.id ? " active" : "");
    const avatar = document.createElement("div");
    avatar.className = "avatar";
    avatar.textContent = initials(nameOf(row.profile));
    const info = document.createElement("div");
    info.className = "contact-text";
    const title = document.createElement("div");
    title.className = "contact-name";
    title.textContent = nameOf(row.profile);
    const preview = document.createElement("div");
    preview.className = "contact-preview";
    preview.textContent = "Ouvrir la conversation";
    info.append(title,preview);
    button.append(avatar,info);
    button.addEventListener("click",()=>openConversation(row.conversation,row.profile));
    list.append(button);
  }
}

async function startConversation(profile) {
  if (!profile || profile.id===me.id) return;
  activeContact = profile;
  status("Ouverture de la conversation…");

  let conversation = conversations.find(c =>
    (c.user_one===me.id && c.user_two===profile.id) ||
    (c.user_two===me.id && c.user_one===profile.id)
  );

  if (!conversation) {
    const {data,error} = await db.from("conversations")
      .insert({user_one:me.id,user_two:profile.id})
      .select("id,user_one,user_two,created_at").single();

    if (error) {
      // Si l'autre utilisateur a créé la conversation en même temps,
      // recherche la conversation existante avant d'afficher une erreur.
      const retry = await db.from("conversations")
        .select("id,user_one,user_two,created_at")
        .or("and(user_one.eq."+me.id+",user_two.eq."+profile.id+"),and(user_one.eq."+profile.id+",user_two.eq."+me.id+")")
        .limit(1).maybeSingle();

      if (retry.error || !retry.data) {
        status("Création impossible : " + error.message,"error");
        return;
      }
      conversation = retry.data;
    } else conversation = data;
  }

  if (!conversations.some(c=>c.id===conversation.id)) conversations.unshift(conversation);
  await openConversation(conversation,profile);
  await renderConversations();
}

async function openConversation(conversation,profile) {
  activeConversation = conversation;
  activeContact = profile;
  $("chatTitle").textContent = nameOf(profile);
  $("chatSubtitle").textContent = profile.nexora_id ? "ID NEXORA : "+profile.nexora_id : "@"+(profile.username||"utilisateur");
  $("chatAvatar").textContent = initials(nameOf(profile));
  $("welcome").classList.add("hidden");
  $("messages").style.display = "flex";
  $("composer").style.display = "flex";
  document.body.classList.add("mobile-chat");

  if (messageChannel) {
    await db.removeChannel(messageChannel);
    messageChannel = null;
  }
  await loadMessages();

  messageChannel = db.channel("messages-"+conversation.id)
    .on("postgres_changes", {
      event:"*", schema:"public", table:"messages",
      filter:"conversation_id=eq."+conversation.id
    }, () => loadMessages())
    .subscribe();

  renderContacts();
  status("");
}

async function loadMessages() {
  if (!activeConversation) return;
  const {data,error} = await db.from("messages")
    .select("id,conversation_id,sender_id,content,created_at")
    .eq("conversation_id",activeConversation.id)
    .order("created_at",{ascending:true}).limit(500);

  if (error) {
    status("Lecture des messages impossible : "+error.message,"error");
    return;
  }

  const container = $("messages");
  container.replaceChildren();

  if (!data?.length) {
    const label = document.createElement("div");
    label.className = "day-label";
    label.textContent = "Début de votre conversation";
    container.append(label);
  } else {
    data.forEach(message => {
      const row = document.createElement("div");
      row.className = "bubble-row "+(message.sender_id===me.id?"mine":"theirs");
      const bubble = document.createElement("div");
      bubble.className = "bubble";
      bubble.textContent = message.content;
      const time = document.createElement("div");
      time.className = "time";
      time.textContent = timeOf(message.created_at);
      row.append(bubble,time);
      container.append(row);
    });
  }
  container.scrollTop = container.scrollHeight;
}

$("composer").addEventListener("submit",async event=>{
  event.preventDefault();
  const content = $("messageInput").value.trim();
  if (!content || !activeConversation || sending) return;

  sending = true;
  $("sendBtn").disabled = true;
  try {
    const {error} = await db.from("messages").insert({
      conversation_id:activeConversation.id,
      sender_id:me.id,
      content
    });
    if (error) throw error;

    $("messageInput").value = "";
    $("messageInput").style.height = "auto";
    await loadMessages();
    status("");
  } catch (error) {
    status("Envoi impossible : "+error.message,"error");
  } finally {
    sending = false;
    $("sendBtn").disabled = false;
    $("messageInput").focus();
  }
});

$("messageInput").addEventListener("input",function(){
  this.style.height = "auto";
  this.style.height = Math.min(this.scrollHeight,140)+"px";
});
$("messageInput").addEventListener("keydown",event=>{
  if (event.key==="Enter" && !event.shiftKey) {
    event.preventDefault();
    $("composer").requestSubmit();
  }
});
$("searchInput").addEventListener("input",()=>{
  renderContacts();
  renderConversations();
});
$("refreshBtn").addEventListener("click",loadData);
$("backBtn").addEventListener("click",()=>document.body.classList.remove("mobile-chat"));

$("logoutBtn").addEventListener("click",async()=>{
  try {
    if (messageChannel) await db.removeChannel(messageChannel);
    if (realtimeChannel) await db.removeChannel(realtimeChannel);
    await db.auth.signOut({scope:"local"});
  } catch {}
  sessionStorage.removeItem("nexora_session");
  sessionStorage.removeItem("nexora_user");
  location.replace("/");
});

function subscribeRealtime() {
  realtimeChannel = db.channel("nexora-updates")
    .on("postgres_changes",{event:"*",schema:"public",table:"conversations"},()=>loadData())
    .subscribe();
}

init().catch(error=>{
  console.error(error);
  status("Erreur au démarrage : "+(error.message||"réessaie"),"error");
});
</script>
</body>
</html>
