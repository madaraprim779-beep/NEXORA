<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#080b16">
  <meta name="description" content="NEXORA — Discutez librement, simplement et en toute sécurité.">
  <title>NEXORA — Connexion</title>

  <style>
    :root {
      --bg: #080b16;
      --panel: #11172a;
      --panel2: #171f36;
      --blue: #6675ff;
      --cyan: #31d8ff;
      --text: #f5f7ff;
      --muted: #9ba8c7;
      --border: rgba(160, 177, 255, .15);
      --danger: #ff647c;
      --success: #5df0b1;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 22px;
      color: var(--text);
      background:
        radial-gradient(ellipse at 15% 15%, #263276 0, transparent 38%),
        radial-gradient(ellipse at 85% 85%, #102c4d 0, transparent 38%),
        var(--bg);
      font-family: system-ui, -apple-system, sans-serif;
    }

    .container {
      width: 100%;
      max-width: 430px;
    }

    .top {
      text-align: center;
      margin-bottom: 25px;
    }

    .logo {
      width: 78px;
      height: 78px;
      display: grid;
      place-items: center;
      margin: 0 auto 15px;
      border-radius: 25px;
      background: linear-gradient(135deg, var(--blue), var(--cyan));
      box-shadow: 0 12px 45px #596bff45;
      font-size: 34px;
      font-weight: 900;
      color: white;
      transform: rotate(-3deg);
    }

    h1 {
      font-size: 34px;
      letter-spacing: 3px;
      font-weight: 900;
    }

    h1 span {
      color: var(--cyan);
    }

    .subtitle {
      margin-top: 8px;
      color: var(--muted);
      font-size: 14px;
    }

    .card {
      padding: 25px;
      border: 1px solid var(--border);
      border-radius: 25px;
      background: rgba(17, 23, 42, .94);
      box-shadow: 0 24px 80px #0005;
      backdrop-filter: blur(16px);
    }

    .language {
      display: flex;
      justify-content: flex-end;
      margin-bottom: 18px;
    }

    select {
      max-width: 100%;
      padding: 9px 12px;
      border: 1px solid var(--border);
      border-radius: 10px;
      color: var(--text);
      background: var(--panel2);
      outline: none;
    }

    .tabs {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 6px;
      padding: 5px;
      margin-bottom: 24px;
      border-radius: 14px;
      background: #080c18;
    }

    .tab {
      padding: 12px 7px;
      border: 0;
      border-radius: 10px;
      color: var(--muted);
      background: transparent;
      font-size: 14px;
      font-weight: 750;
      cursor: pointer;
    }

    .tab.active {
      color: white;
      background: linear-gradient(110deg, #596aff, #397fe9);
      box-shadow: 0 5px 20px #596aff30;
    }

    h2 {
      margin-bottom: 8px;
      font-size: 23px;
    }

    .description {
      margin-bottom: 23px;
      color: var(--muted);
      font-size: 13px;
      line-height: 1.6;
    }

    .field {
      margin-bottom: 17px;
    }

    label {
      display: block;
      margin-bottom: 8px;
      color: #dce4ff;
      font-size: 13px;
      font-weight: 700;
    }

    input {
      width: 100%;
      padding: 14px 15px;
      border: 1px solid var(--border);
      border-radius: 12px;
      outline: none;
      color: white;
      background: #0b1020;
      font: inherit;
      font-size: 14px;
      transition: border .2s, box-shadow .2s;
    }

    input:focus {
      border-color: var(--blue);
      box-shadow: 0 0 0 3px #6675ff20;
    }

    input::placeholder {
      color: #6f7b9a;
    }

    .hint {
      margin-top: 7px;
      color: #8290b2;
      font-size: 11px;
    }

    .submit {
      width: 100%;
      margin-top: 5px;
      padding: 15px;
      border: none;
      border-radius: 13px;
      color: white;
      background: linear-gradient(110deg, #596aff, #397fe9);
      font-size: 15px;
      font-weight: 800;
      cursor: pointer;
      transition: opacity .2s, transform .2s;
    }

    .submit:active {
      transform: scale(.98);
    }

    .submit:disabled {
      opacity: .6;
      cursor: wait;
    }

    .message {
      display: none;
      padding: 12px;
      margin-bottom: 17px;
      border-radius: 11px;
      font-size: 13px;
      line-height: 1.5;
      overflow-wrap: anywhere;
    }

    .message.error {
      display: block;
      color: #ffb7c3;
      background: #70263a35;
      border: 1px solid #ff647c40;
    }

    .message.success {
      display: block;
      color: #a3ffdb;
      background: #155d4530;
      border: 1px solid #5df0b140;
    }

    .footer {
      margin-top: 22px;
      text-align: center;
      color: var(--muted);
      font-size: 11px;
      line-height: 1.8;
    }

    .security {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 7px;
      margin-top: 15px;
      color: #a4b2d3;
      font-size: 12px;
    }

    @media (max-width: 380px) {
      body {
        padding: 12px;
      }

      .card {
        padding: 19px;
      }

      h1 {
        font-size: 29px;
      }
    }
  </style>
</head>

<body>
  <main class="container">
    <header class="top">
      <div class="logo">N</div>
      <h1>NEX<span>ORA</span></h1>
      <p class="subtitle" id="subtitle">
        Connecte-toi au monde.
      </p>
    </header>

    <section class="card">
      <div class="language">
        <select id="language" aria-label="Langue">
          <option value="fr">🇫🇷 Français</option>
          <option value="en">🇬🇧 English</option>
          <option value="es">🇪🇸 Español</option>
          <option value="pt">🇵🇹 Português</option>
          <option value="ar">🇸🇦 العربية</option>
        </select>
      </div>

      <div class="tabs">
        <button class="tab active" id="loginTab" type="button">
          Se connecter
        </button>
        <button class="tab" id="registerTab" type="button">
          Inscription
        </button>
      </div>

      <h2 id="title">Bon retour !</h2>
      <p class="description" id="description">
        Connecte-toi pour retrouver tes conversations.
      </p>

      <div id="message" class="message" role="status" aria-live="polite"></div>

      <form id="authForm">
        <div class="field">
          <label for="username" id="usernameLabel">Nom d'utilisateur</label>
          <input
            id="username"
            name="username"
            type="text"
            placeholder="Ex. MadaraTest"
            minlength="3"
            maxlength="24"
            pattern="[a-zA-Z0-9_]{3,24}"
            autocomplete="username"
            autocapitalize="none"
            spellcheck="false"
            required
          >
          <p class="hint" id="usernameHint">
            3 à 24 caractères : lettres, chiffres et _.
          </p>
        </div>

        <div class="field">
          <label for="password" id="passwordLabel">Mot de passe</label>
          <input
            id="password"
            name="password"
            type="password"
            placeholder="Ton mot de passe"
            minlength="8"
            maxlength="128"
            autocomplete="current-password"
            required
          >
          <p class="hint" id="passwordHint">
            Au moins 8 caractères.
          </p>
        </div>

        <button class="submit" id="submitButton" type="submit">
          Se connecter
        </button>
      </form>

      <div class="security">
        <span>🔒</span>
        <span id="securityText">Connexion sécurisée</span>
      </div>
    </section>

    <footer class="footer">
      <p>© 2026 NEXORA</p>
      <p id="tagline">Ta communauté. Tes conversations. Ton univers.</p>
    </footer>
  </main>

  <script>
    const translations = {
      fr: {
        subtitle: "Connecte-toi au monde.",
        login: "Se connecter",
        register: "Inscription",
        welcome: "Bon retour !",
        create: "Rejoins NEXORA",
        loginDesc: "Connecte-toi pour retrouver tes conversations.",
        registerDesc: "Crée ton compte et entre dans ton univers.",
        username: "Nom d'utilisateur",
        usernamePlaceholder: "Ex. MadaraTest",
        usernameHint: "3 à 24 caractères : lettres, chiffres et _.",
        password: "Mot de passe",
        passwordPlaceholder: "Ton mot de passe",
        passwordHint: "Au moins 8 caractères.",
        loginButton: "Se connecter",
        registerButton: "Créer mon compte",
        security: "Connexion sécurisée",
        tagline: "Ta communauté. Tes conversations. Ton univers.",
        registering: "Création du compte...",
        loggingIn: "Connexion...",
        registered: "Compte créé ! Connecte-toi avec tes identifiants.",
        connecting: "Connexion réussie. Ouverture de NEXORA...",
        genericError: "Une erreur est survenue.",
        networkError: "Impossible de contacter le serveur. Réessaie.",
        invalid: "Vérifie ton pseudo et ton mot de passe.",
        sessionError: "Le serveur n'a pas retourné de session valide."
      },
      en: {
        subtitle: "Connect to the world.",
        login: "Log in",
        register: "Sign up",
        welcome: "Welcome back!",
        create: "Join NEXORA",
        loginDesc: "Log in to find your conversations.",
        registerDesc: "Create your account and join your world.",
        username: "Username",
        usernamePlaceholder: "e.g. MadaraTest",
        usernameHint: "3–24 characters: letters, numbers and _.",
        password: "Password",
        passwordPlaceholder: "Your password",
        passwordHint: "At least 8 characters.",
        loginButton: "Log in",
        registerButton: "Create my account",
        security: "Secure connection",
        tagline: "Your community. Your conversations. Your world.",
        registering: "Creating account...",
        loggingIn: "Logging in...",
        registered: "Account created! Now log in.",
        connecting: "Login successful. Opening NEXORA...",
        genericError: "Something went wrong.",
        networkError: "Could not contact the server. Try again.",
        invalid: "Check your username and password.",
        sessionError: "The server did not return a valid session."
      },
      es: {
        subtitle: "Conéctate con el mundo.",
        login: "Iniciar sesión",
        register: "Registrarse",
        welcome: "¡Bienvenido de nuevo!",
        create: "Únete a NEXORA",
        loginDesc: "Inicia sesión para ver tus conversaciones.",
        registerDesc: "Crea tu cuenta y entra en tu mundo.",
        username: "Nombre de usuario",
        usernamePlaceholder: "Ej. MadaraTest",
        usernameHint: "3–24 caracteres: letras, números y _.",
        password: "Contraseña",
        passwordPlaceholder: "Tu contraseña",
        passwordHint: "Al menos 8 caracteres.",
        loginButton: "Iniciar sesión",
        registerButton: "Crear mi cuenta",
        security: "Conexión segura",
        tagline: "Tu comunidad. Tus conversaciones. Tu mundo.",
        registering: "Creando cuenta...",
        loggingIn: "Iniciando sesión...",
        registered: "¡Cuenta creada! Ahora inicia sesión.",
        connecting: "Conexión correcta. Abriendo NEXORA...",
        genericError: "Ha ocurrido un error.",
        networkError: "No se pudo contactar con el servidor.",
        invalid: "Comprueba tu usuario y contraseña.",
        sessionError: "El servidor no devolvió una sesión válida."
      },
      pt: {
        subtitle: "Conecta-te ao mundo.",
        login: "Entrar",
        register: "Registar",
        welcome: "Bem-vindo de volta!",
        create: "Junta-te à NEXORA",
        loginDesc: "Entra para encontrares as tuas conversas.",
        registerDesc: "Cria a tua conta e entra no teu universo.",
        username: "Nome de utilizador",
        usernamePlaceholder: "Ex. MadaraTest",
        usernameHint: "3–24 caracteres: letras, números e _.",
        password: "Palavra-passe",
        passwordPlaceholder: "A tua palavra-passe",
        passwordHint: "Pelo menos 8 caracteres.",
        loginButton: "Entrar",
        registerButton: "Criar a minha conta",
        security: "Ligação segura",
        tagline: "A tua comunidade. As tuas conversas. O teu universo.",
        registering: "A criar conta...",
        loggingIn: "A iniciar sessão...",
        registered: "Conta criada! Agora inicia sessão.",
        connecting: "Ligação efetuada. A abrir NEXORA...",
        genericError: "Ocorreu um erro.",
        networkError: "Não foi possível contactar o servidor.",
        invalid: "Verifica o nome de utilizador e a palavra-passe.",
        sessionError: "O servidor não devolveu uma sessão válida."
      },
      ar: {
        subtitle: "تواصل مع العالم",
        login: "تسجيل الدخول",
        register: "إنشاء حساب",
        welcome: "مرحباً بعودتك!",
        create: "انضم إلى NEXORA",
        loginDesc: "سجّل الدخول للوصول إلى محادثاتك.",
        registerDesc: "أنشئ حسابك وابدأ عالمك.",
        username: "اسم المستخدم",
        usernamePlaceholder: "مثال: MadaraTest",
        usernameHint: "من 3 إلى 24 حرفاً أو رقماً أو _.",
        password: "كلمة المرور",
        passwordPlaceholder: "كلمة المرور",
        passwordHint: "8 أحرف على الأقل.",
        loginButton: "تسجيل الدخول",
        registerButton: "إنشاء حسابي",
        security: "اتصال آمن",
        tagline: "مجتمعك. محادثاتك. عالمك.",
        registering: "جارٍ إنشاء الحساب...",
        loggingIn: "جارٍ تسجيل الدخول...",
        registered: "تم إنشاء الحساب! سجّل الدخول الآن.",
        connecting: "تم تسجيل الدخول. جارٍ فتح NEXORA...",
        genericError: "حدث خطأ.",
        networkError: "تعذر الاتصال بالخادم. حاول مجدداً.",
        invalid: "تحقق من اسم المستخدم وكلمة المرور.",
        sessionError: "لم يُرجع الخادم جلسة صالحة."
      }
    };

    const $ = (id) => document.getElementById(id);

    let mode = "login";
    let language = "fr";

    function t(key) {
      return translations[language][key] || translations.fr[key] || key;
    }

    function showMessage(text, type) {
      const box = $("message");
      box.textContent = text;
      box.className = "message " + type;
    }

    function clearMessage() {
      $("message").textContent = "";
      $("message").className = "message";
    }

    function setMode(nextMode) {
      mode = nextMode;
      clearMessage();

      $("loginTab").classList.toggle("active", mode === "login");
      $("registerTab").classList.toggle("active", mode === "register");

      $("title").textContent = mode === "login" ? t("welcome") : t("create");
      $("description").textContent =
        mode === "login" ? t("loginDesc") : t("registerDesc");

      $("submitButton").textContent =
        mode === "login" ? t("loginButton") : t("registerButton");

      $("password").autocomplete =
        mode === "login" ? "current-password" : "new-password";
    }

    function applyLanguage() {
      language = $("language").value;
      document.documentElement.lang = language;
      document.documentElement.dir = language === "ar" ? "rtl" : "ltr";

      $("subtitle").textContent = t("subtitle");
      $("loginTab").textContent = t("login");
      $("registerTab").textContent = t("register");
      $("usernameLabel").textContent = t("username");
      $("username").placeholder = t("usernamePlaceholder");
      $("usernameHint").textContent = t("usernameHint");
      $("passwordLabel").textContent = t("password");
      $("password").placeholder = t("passwordPlaceholder");
      $("passwordHint").textContent = t("passwordHint");
      $("securityText").textContent = t("security");
      $("tagline").textContent = t("tagline");

      setMode(mode);
    }

    $("loginTab").addEventListener("click", () => setMode("login"));
    $("registerTab").addEventListener("click", () => setMode("register"));
    $("language").addEventListener("change", applyLanguage);

    $("authForm").addEventListener("submit", async (event) => {
      event.preventDefault();
      clearMessage();

      const username = $("username").value.trim();
      const password = $("password").value;

      if (!/^[a-zA-Z0-9_]{3,24}$/.test(username)) {
        showMessage(t("invalid"), "error");
        return;
      }

      if (password.length < 8 || password.length > 128) {
        showMessage(t("invalid"), "error");
        return;
      }

      const button = $("submitButton");
      button.disabled = true;
      button.textContent = mode === "login" ? t("loggingIn") : t("registering");

      try {
        const response = await fetch("/api/auth", {
          method: "POST",
          headers: {
            "Content-Type": "application/json"
          },
          body: JSON.stringify({
            action: mode === "login" ? "login" : "register",
            username,
            password
          })
        });

        const data = await response.json().catch(() => ({}));

        if (!response.ok || data.success !== true) {
          throw new Error(data.error || data.message || t("genericError"));
        }

        if (mode === "register") {
          $("password").value = "";
          setMode("login");
          showMessage(t("registered"), "success");
          return;
        }

        const session = data.session;
        const user = data.user;

        if (!session || !session.access_token || !user) {
          throw new Error(t("sessionError"));
        }

        // Enregistre la session pour chat.js.
        sessionStorage.setItem("nexora_session", JSON.stringify(session));
        sessionStorage.setItem("nexora_user", JSON.stringify(user));

        showMessage(t("connecting"), "success");
        button.textContent = t("connecting");

        // Ouvre l'écran de discussion après connexion.
        window.location.assign("/chat.html");

      } catch (error) {
        showMessage(
          error.message === "Failed to fetch"
            ? t("networkError")
            : error.message || t("genericError"),
          "error"
        );
      } finally {
        button.disabled = false;
        if (mode === "login") {
          button.textContent = t("loginButton");
        } else {
          button.textContent = t("registerButton");
        }
      }
    });

    applyLanguage();
  </script>
</body>
</html>
