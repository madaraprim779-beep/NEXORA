
<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#090a12">
  <title>NEXORA — Connexion</title>
  <style>
    :root {
      --bg:#090a12;--panel:#121522;--border:#2a3046;
      --text:#f7f7ff;--muted:#9ba3bb;
      --accent:#8b5cf6;--blue:#4361ee;
    }
    *{box-sizing:border-box}
    body{
      margin:0;min-height:100vh;color:var(--text);
      font-family:system-ui,sans-serif;
      background:radial-gradient(ellipse at top,#302052,transparent 50%),var(--bg)
    }
    header{
      display:flex;align-items:center;justify-content:space-between;
      padding:18px 5%;border-bottom:1px solid #ffffff12
    }
    .brand{font-size:24px;font-weight:900;letter-spacing:1px}
    .logo{
      display:inline-grid;place-items:center;width:40px;height:40px;
      margin-right:8px;border-radius:13px;
      background:linear-gradient(135deg,var(--accent),var(--blue))
    }
    select,input,button{font:inherit}
    select{
      max-width:145px;padding:9px;border-radius:10px;
      color:var(--text);background:var(--panel);border:1px solid var(--border)
    }
    main{
      width:min(460px,100%);margin:35px auto;padding:18px
    }
    .card{
      padding:26px;border:1px solid #ffffff18;border-radius:22px;
      background:#121522ed;box-shadow:0 20px 70px #0005
    }
    h1{margin:0 0 8px;font-size:30px}
    .muted{color:var(--muted);font-size:14px;line-height:1.6}
    .tabs{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin:22px 0}
    .tab{
      padding:12px;border:0;border-radius:10px;
      background:#090c15;color:var(--muted)
    }
    .tab.active{background:linear-gradient(110deg,var(--accent),var(--blue));color:white}
    .field{margin-bottom:17px}
    label{display:block;margin-bottom:8px;font-size:13px;font-weight:700}
    input{
      width:100%;padding:13px;border:1px solid var(--border);
      border-radius:11px;background:#090c15;color:white;outline:none
    }
    input:focus{border-color:var(--accent)}
    .langbox{padding:12px;border:1px solid var(--border);border-radius:12px}
    .lang-toggle{
      width:100%;padding:6px;border:0;background:transparent;color:white;
      text-align:left;display:flex;justify-content:space-between
    }
    .lang-list{display:none;margin-top:10px}
    .lang-list.open{display:block}
    .lang-options{max-height:190px;overflow:auto;margin-top:8px}
    .lang-option{
      display:block;width:100%;padding:10px;text-align:left;
      border:0;border-radius:8px;background:transparent;color:white
    }
    .lang-option:hover,.lang-option.selected{background:#8b5cf633}
    .primary{
      width:100%;padding:14px;border:0;border-radius:11px;
      color:white;font-weight:800;
      background:linear-gradient(110deg,var(--accent),var(--blue))
    }
    .primary:disabled{opacity:.6}
    .message{display:none;margin:14px 0;padding:12px;border-radius:10px;font-size:13px;overflow-wrap:anywhere}
    .message.show{display:block}
    .error{background:#ff53631c;color:#ff9da8}
    .success{background:#40d9a51c;color:#7df0ca}
    footer{text-align:center;padding:20px;color:var(--muted);font-size:12px}
    [hidden]{display:none!important}
  </style>
</head>
<body>
  <header>
    <div class="brand"><span class="logo">N</span>NEXORA</div>
    <select id="topLanguage" aria-label="Langue"></select>
  </header>

  <main>
    <section class="card">
      <h1 id="title">Bienvenue sur NEXORA</h1>
      <p class="muted" id="subtitle">Discute avec le monde. Ton compte t'attend.</p>

      <div class="tabs">
        <button class="tab active" id="loginTab" type="button">Connexion</button>
        <button class="tab" id="registerTab" type="button">Inscription</button>
      </div>

      <form id="authForm">
        <div class="field">
          <label for="username" id="usernameLabel">Pseudo</label>
          <input id="username" name="username" autocomplete="username"
            minlength="3" maxlength="24" pattern="[A-Za-z0-9_]{3,24}"
            placeholder="ex. madara225" required>
        </div>

        <div class="field">
          <label for="password" id="passwordLabel">Mot de passe</label>
          <input id="password" name="password" type="password"
            minlength="8" maxlength="128" autocomplete="current-password"
            placeholder="8 caractères minimum" required>
        </div>

        <div class="field">
          <label id="languageLabel">Langue de l'application</label>
          <div class="langbox">
            <button class="lang-toggle" type="button" id="languageToggle"
              aria-expanded="false">
              <span id="selectedLanguage">🇫🇷 Français</span><span>⌄</span>
            </button>
            <div class="lang-list" id="languageList">
              <input id="languageSearch" type="search"
                placeholder="Rechercher une langue..." aria-label="Rechercher une langue">
              <div class="lang-options" id="languageOptions"></div>
            </div>
          </div>
        </div>

        <div id="feedback" class="message" role="status" aria-live="polite"></div>
        <button class="primary" id="submitButton" type="submit">Se connecter</button>
      </form>

      <p class="muted" style="font-size:11px;margin-top:18px">
        Ne partage jamais ton mot de passe. Utilise NEXORA de manière responsable.
      </p>
    </section>
  </main>
  <footer>© <span id="year"></span> NEXORA</footer>

  <script>
    "use strict";

    const LANGUAGES = [
      ["af","Afrikaans"],["am","አማርኛ"],["ar","العربية"],
      ["az","Azərbaycanca"],["be","Беларуская"],["bg","Български"],
      ["bm","Bamanankan"],["bn","বাংলা"],["bs","Bosanski"],
      ["ca","Català"],["cs","Čeština"],["cy","Cymraeg"],
      ["da","Dansk"],["de","Deutsch"],["el","Ελληνικά"],
      ["en","English"],["es","Español"],["et","Eesti"],
      ["eu","Euskara"],["fa","فارسی"],["fi","Suomi"],
      ["fil","Filipino"],["fr","Français"],["ga","Gaeilge"],
      ["gl","Galego"],["gu","ગુજરાતી"],["ha","Hausa"],
      ["he","עברית"],["hi","हिन्दी"],["hr","Hrvatski"],
      ["ht","Kreyòl ayisyen"],["hu","Magyar"],["hy","Հայերեն"],
      ["id","Bahasa Indonesia"],["ig","Igbo"],["is","Íslenska"],
      ["it","Italiano"],["ja","日本語"],["jv","Basa Jawa"],
      ["ka","ქართული"],["kk","Қазақша"],["km","ខ្មែរ"],
      ["kn","ಕನ್ನಡ"],["ko","한국어"],["ku","Kurdî"],
      ["ky","Кыргызча"],["lo","ລາວ"],["lt","Lietuvių"],
      ["lv","Latviešu"],["mg","Malagasy"],["mi","Māori"],
      ["mk","Македонски"],["ml","മലയാളം"],["mn","Монгол"],
      ["mr","मराठी"],["ms","Bahasa Melayu"],["mt","Malti"],
      ["my","မြန်မာ"],["ne","नेपाली"],["nl","Nederlands"],
      ["no","Norsk"],["ny","Chichewa"],["om","Afaan Oromoo"],
      ["or","ଓଡ଼ିଆ"],["pa","ਪੰਜਾਬੀ"],["pl","Polski"],
      ["ps","پښتو"],["pt","Português"],["ro","Română"],
      ["ru","Русский"],["rw","Kinyarwanda"],["si","සිංහල"],
      ["sk","Slovenčina"],["sl","Slovenščina"],["sn","ChiShona"],
      ["so","Soomaali"],["sq","Shqip"],["sr","Српски"],
      ["sv","Svenska"],["sw","Kiswahili"],["ta","தமிழ்"],
      ["te","తెలుగు"],["th","ไทย"],["ti","ትግርኛ"],
      ["tr","Türkçe"],["uk","Українська"],["ur","اردو"],
      ["uz","Oʻzbekcha"],["vi","Tiếng Việt"],["wo","Wolof"],
      ["xh","isiXhosa"],["yo","Yorùbá"],["zh","中文"],
      ["zu","isiZulu"],["ak","Akan"],["ee","Eʋegbe"],
      ["ff","Fulfulde"],["ln","Lingála"],["nd","isiNdebele"],
      ["rn","Ikirundi"],["sg","Sängö"],["st","Sesotho"],
      ["tn","Setswana"],["tw","Twi"]
    ];

    const TEXT = {
      fr:{
        title:"Bienvenue sur NEXORA",subtitle:"Discute avec le monde. Ton compte t'attend.",
        login:"Connexion",register:"Inscription",username:"Pseudo",
        password:"Mot de passe",language:"Langue de l'application",
        search:"Rechercher une langue...",submitLogin:"Se connecter",
        submitRegister:"Créer mon compte",wait:"Patiente...",
        invalid:"Le pseudo doit contenir 3 à 24 lettres, chiffres ou _.",
        fail:"Impossible de terminer la demande.",
        network:"Erreur réseau. Vérifie que NEXORA est déployé.",
        registered:"Compte créé. Tu peux maintenant te connecter."
      },
      en:{
        title:"Welcome to NEXORA",subtitle:"Connect with the world.",
        login:"Sign in",register:"Sign up",username:"Username",
        password:"Password",language:"App language",
        search:"Search languages...",submitLogin:"Sign in",
        submitRegister:"Create account",wait:"Please wait...",
        invalid:"Username must be 3–24 letters, numbers or underscores.",
        fail:"The request could not be completed.",
        network:"Network error. Check the deployment.",
        registered:"Account created. You can now sign in."
      },
      es:{
        title:"Bienvenido a NEXORA",subtitle:"Conecta con el mundo.",
        login:"Iniciar sesión",register:"Registrarse",username:"Usuario",
        password:"Contraseña",language:"Idioma de la aplicación",
        search:"Buscar idioma...",submitLogin:"Iniciar sesión",
        submitRegister:"Crear cuenta",wait:"Espera...",
        invalid:"El usuario debe tener entre 3 y 24 caracteres válidos.",
        fail:"No se pudo completar la solicitud.",
        network:"Error de red.",
        registered:"Cuenta creada. Ya puedes iniciar sesión."
      },
      pt:{
        title:"Bem-vindo ao NEXORA",subtitle:"Conecte-se com o mundo.",
        login:"Entrar",register:"Cadastrar",username:"Nome de usuário",
        password:"Senha",language:"Idioma do aplicativo",
        search:"Pesquisar idioma...",submitLogin:"Entrar",
        submitRegister:"Criar conta",wait:"Aguarde...",
        invalid:"O nome deve ter entre 3 e 24 caracteres válidos.",
        fail:"Não foi possível concluir a solicitação.",
        network:"Erro de rede.",
        registered:"Conta criada. Agora você pode entrar."
      },
      ar:{
        title:"مرحبًا بك في NEXORA",subtitle:"تواصل مع العالم.",
        login:"تسجيل الدخول",register:"إنشاء حساب",username:"اسم المستخدم",
        password:"كلمة المرور",language:"لغة التطبيق",
        search:"ابحث عن لغة...",submitLogin:"تسجيل الدخول",
        submitRegister:"إنشاء حساب",wait:"يرجى الانتظار...",
        invalid:"يجب أن يتكون اسم المستخدم من 3 إلى 24 حرفًا صالحًا.",
        fail:"تعذر إكمال الطلب.",network:"خطأ في الاتصال.",
        registered:"تم إنشاء الحساب. يمكنك تسجيل الدخول الآن."
      }
    };

    let mode = "login";
    let language = "fr";
    const $ = id => document.getElementById(id);

    function t(key) {
      return (TEXT[language] || TEXT.fr)[key] || TEXT.fr[key] || key;
    }

    function message(text, kind="error") {
      $("feedback").textContent = text;
      $("feedback").className = "message show " + kind;
    }

    function applyLanguage(code) {
      language = LANGUAGES.some(x => x[0] === code) ? code : "fr";
      try { localStorage.setItem("nexora_language", language); } catch {}
      document.documentElement.lang = language;
      document.documentElement.dir = language === "ar" ? "rtl" : "ltr";
      $("topLanguage").value = language;
      $("selectedLanguage").textContent =
        (LANGUAGES.find(x => x[0] === language)?.[1] || language) +
        " (" + language + ")";
      $("title").textContent = t("title");
      $("subtitle").textContent = t("subtitle");
      $("loginTab").textContent = t("login");
      $("registerTab").textContent = t("register");
      $("usernameLabel").textContent = t("username");
      $("passwordLabel").textContent = t("password");
      $("languageLabel").textContent = t("language");
      $("languageSearch").placeholder = t("search");
      $("submitButton").textContent =
        mode === "login" ? t("submitLogin") : t("submitRegister");
      renderLanguages($("languageSearch").value);
    }

    function renderLanguages(query="") {
      const target = $("languageOptions");
      target.replaceChildren();
      const q = query.trim().toLocaleLowerCase();
      const results = LANGUAGES.filter(([code, name]) =>
        code.toLowerCase().includes(q) || name.toLocaleLowerCase().includes(q)
      );
      results.forEach(([code, name]) => {
        const btn = document.createElement("button");
        btn.type = "button";
        btn.className = "lang-option" + (code === language ? " selected" : "");
        btn.textContent = name + " (" + code + ")";
        btn.addEventListener("click", () => {
          applyLanguage(code);
          $("languageList").classList.remove("open");
          $("languageToggle").setAttribute("aria-expanded", "false");
        });
        target.appendChild(btn);
      });
      if (!results.length) {
        const p = document.createElement("p");
        p.textContent = "Aucun résultat.";
        target.appendChild(p);
      }
    }

    function setMode(next) {
      mode = next;
      $("loginTab").classList.toggle("active", mode === "login");
      $("registerTab").classList.toggle("active", mode === "register");
      $("password").autocomplete = mode === "login"
        ? "current-password" : "new-password";
      $("feedback").className = "message";
      $("submitButton").textContent =
        mode === "login" ? t("submitLogin") : t("submitRegister");
    }

    $("loginTab").addEventListener("click", () => setMode("login"));
    $("registerTab").addEventListener("click", () => setMode("register"));

    $("languageToggle").addEventListener("click", () => {
      const open = $("languageList").classList.toggle("open");
      $("languageToggle").setAttribute("aria-expanded", String(open));
      if (open) $("languageSearch").focus();
    });

    $("languageSearch").addEventListener("input", e =>
      renderLanguages(e.target.value)
    );
    $("topLanguage").addEventListener("change", e =>
      applyLanguage(e.target.value)
    );

    $("authForm").addEventListener("submit", async e => {
      e.preventDefault();

      const username = $("username").value.trim().toLowerCase();
      const password = $("password").value;
      const button = $("submitButton");

      if (!/^[a-z0-9_]{3,24}$/.test(username)) {
        message(t("invalid"));
        return;
      }
      if (password.length < 8 || password.length > 128) {
        message("Le mot de passe doit contenir entre 8 et 128 caractères.");
        return;
      }

      button.disabled = true;
      button.textContent = t("wait");

      try {
        const response = await fetch("/api/auth", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          credentials: "same-origin",
          body: JSON.stringify({
            action: mode === "login" ? "login" : "register",
            username,
            password
          })
        });

        const data = await response.json().catch(() => ({}));

        if (!response.ok || data.error) {
          throw new Error(data.error || t("fail"));
        }

        if (mode === "register") {
          message(data.message || t("registered"), "success");
          setMode("login");
          return;
        }

        if (!data.session || !data.session.access_token ||
            !data.session.refresh_token) {
          throw new Error(
            "Connexion reçue, mais la session n'est pas complète. Il faut adapter api/auth.js pour établir une session persistante."
          );
        }

        /*
         * Cette version ne stocke pas le mot de passe.
         * Le jeton de session est sensible : cette méthode côté
         * navigateur est provisoire, à remplacer par des cookies
         * HttpOnly côté serveur avant une mise en production.
         */
        try {
          sessionStorage.setItem("nexora_session", JSON.stringify(data.session));
          sessionStorage.setItem("nexora_user", JSON.stringify(data.user || {username}));
        } catch {
          throw new Error("Le navigateur ne permet pas de conserver la session.");
        }

        message("Connexion réussie. La session est prête pour l'intégration de l'écran de discussion.", "success");

        if (data.redirect && data.redirect.startsWith("/") &&
            !data.redirect.startsWith("//")) {
          window.location.assign(data.redirect);
        }
      } catch (err) {
        message(err.message || t("network"));
      } finally {
        button.disabled = false;
        $("submitButton").textContent =
          mode === "login" ? t("submitLogin") : t("submitRegister");
      }
    });

    function init() {
      $("year").textContent = new Date().getFullYear();
      LANGUAGES.sort((a,b) => a[1].localeCompare(b[1]));
      LANGUAGES.forEach(([code, name]) => {
        const option = document.createElement("option");
        option.value = code;
        option.textContent = name;
        $("topLanguage").appendChild(option);
      });
      let saved = "fr";
      try { saved = localStorage.getItem("nexora_language") || "fr"; } catch {}
      applyLanguage(saved);
      setMode("login");
    }

    init();
  </script>
</body>
</html>
